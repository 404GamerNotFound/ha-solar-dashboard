name: HACS Release Asset Repair

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to repair, for example v1.0.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  repair-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify HACS plugin package
        run: npm test

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp dist/ha-solar-dashboard.js release-assets/ha-solar-dashboard.js
          cp dist/images/*.png release-assets/

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.inputs.tag }}" release-assets/* --clobber
