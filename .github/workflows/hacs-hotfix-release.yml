name: HACS Release Asset Repair

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to repair, for example v2.3.10"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  repair-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve current release tooling
        run: cp scripts/release-assets.mjs "$RUNNER_TEMP/ha-solar-release-assets.mjs"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify HACS plugin package
        run: npm test

      - name: Collect release assets
        run: node "$RUNNER_TEMP/ha-solar-release-assets.mjs" prepare

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: node "$RUNNER_TEMP/ha-solar-release-assets.mjs" publish release-assets "$RELEASE_TAG"
