name: Hassfest

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  hassfest:
    if: ${{ hashFiles('custom_components/**') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master
