name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish assets for"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "release" ]; then
            echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve current release tooling
        run: cp scripts/release-assets.mjs "$RUNNER_TEMP/ha-solar-release-assets.mjs"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify release version
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected_tag" >&2
            exit 1
          fi

      - name: Verify HACS plugin package
        run: npm test

      - name: Prepare release assets
        run: node "$RUNNER_TEMP/ha-solar-release-assets.mjs" prepare

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "Automated release for $RELEASE_TAG"

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node "$RUNNER_TEMP/ha-solar-release-assets.mjs" publish release-assets "$RELEASE_TAG"
